<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>חברי הקבוצה</title>
<style>
:root{--bg:#f6f4ef;--ink:#1d2330;--mut:#6b7280;--card:#fff;--line:#e4e0d6}
@media(prefers-color-scheme:dark){:root{--bg:#161a22;--ink:#eef0f4;--mut:#9aa3b2;--card:#202634;--line:#303848}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
header{padding:28px 20px 8px;text-align:center}
h1{margin:0;font-size:26px}
header p{margin:6px 0 0;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px;max-width:900px;margin:22px auto;padding:0 18px}
.p{background:none;border:0;cursor:pointer;color:inherit;font:inherit;padding:10px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.p:hover,.p:focus-visible{transform:translateY(-4px);outline:none}
.p:focus-visible .av{box-shadow:0 0 0 3px var(--ink)}
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:700;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.p b{font-size:14px;text-align:center;line-height:1.25}
.p small{color:var(--mut);font-size:12px}
dialog{border:0;border-radius:20px;padding:0;background:var(--card);color:var(--ink);width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,18,.55)}
.top{padding:22px 22px 14px;display:flex;gap:14px;align-items:center;color:#fff}
.top .av{width:64px;height:64px;font-size:26px;background:rgba(255,255,255,.22);box-shadow:none}
.top h2{margin:0;font-size:20px}.top span{font-size:13px;opacity:.9}
.body{padding:18px 22px 22px}
.bio{margin:0 0 14px;color:var(--mut);font-size:14px;line-height:1.5}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:17px;line-height:1.5;min-height:84px;display:flex;align-items:center}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.row .pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:10px 0 30px}
</style>
</head>
<body>

<div class="grid" id="grid"></div>
<footer>הנתונים מחושבים מהצאט שיוצא, בקירוב: 515 הודעות</footer>

 <div class="top" id="top"><div class="av" id="dav"></div><div><h2 id="dn"></h2><span id="dt"></span></div></div>
 <div class="body"><p class="bio" id="db"></p><div class="fact" id="df"></div>
 <div class="row"><button class="pri" id="more">נתון נוסף</button><button id="close">סגור</button></div></div>

}
